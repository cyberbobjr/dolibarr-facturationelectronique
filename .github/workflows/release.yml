name: Create Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Check if Tag Exists
        id: check_tag
        run: |
          # Read version from descriptor
          VERSION=$(php -r "
            define('DOL_DOCUMENT_ROOT', 'htdocs');
            class stdClass {}
            class DolibarrModules {}
            include 'core/modules/modFacturationElectronique.class.php';
            \$m = new modFacturationElectronique(null);
            echo \$m->version;
          ")
          echo "Version found: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          # Check if tag already exists in repository
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag v$VERSION already exists. Skipping release."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag v$VERSION does not exist yet. Proceeding with release."
          fi

      - name: Extract Release Notes
        if: steps.check_tag.outputs.exists != 'true'
        run: |
          php build/extract_release_notes.php

      - name: Build Module ZIP
        if: steps.check_tag.outputs.exists != 'true'
        run: |
          php build/pack.php

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.check_tag.outputs.version }}"
          name: "Release v${{ steps.check_tag.outputs.version }}"
          body_path: build/release_notes.md
          draft: false
          prerelease: true
          files: build/module_facturationelectronique-${{ steps.check_tag.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
