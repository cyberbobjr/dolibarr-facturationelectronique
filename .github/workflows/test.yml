name: Run Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Install Dependencies
        run: composer update --no-interaction --prefer-dist --no-progress --dev

      - name: Run PHPUnit Tests
        run: ./vendor/bin/phpunit --configuration phpunit.xml
